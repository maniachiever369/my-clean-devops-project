name: DevOps Verification Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Codebase
        uses: actions/checkout@v4

      - name: Lint Dockerfile for Security Risks
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build Container Image
        run: docker build -t my-clean-app:${{ github.sha }} .

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: 'my-clean-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'


